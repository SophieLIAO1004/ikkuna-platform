<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IKKUNA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  :root {
    --bg: #F5F3EE;
    --panel: #FFFFFF;
    --border: #E2DFD6;
    --text: #2A2A28;
    --text-secondary: #8A8778;
    --accent: #2A2A28;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    height: 100%;
  }
  #app { position: relative; height: 100vh; height: 100dvh; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  .center-content {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
    background: var(--bg);
  }
  .center-content h1 { font-size: 22px; letter-spacing: 0.1em; margin: 0 0 12px; }
  .prompt-label { font-size: 12px; color: var(--text-secondary); margin: 0 0 6px; letter-spacing: 0.05em; }
  .prompt-text { font-size: 19px; color: var(--text); margin: 0 0 32px; font-weight: 500; line-height: 1.6; }
  #promptBanner {
    padding: 10px 16px; text-align: center; font-size: 13px;
    background: var(--panel); border-bottom: 1px solid var(--border); color: var(--text-secondary);
  }
  #promptStepLabel { font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 3px; letter-spacing: 0.05em; }
  #drawPromptText { display: block; color: var(--text); line-height: 1.6; }
  .center-content p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin: 0 0 28px; max-width: 320px; }
  .primary-btn {
    font-size: 15px; padding: 13px 32px; border-radius: 999px; border: none;
    background: var(--accent); color: #FFF; margin-bottom: 12px; width: 220px;
  }
  .secondary-btn {
    font-size: 14px; padding: 12px 32px; border-radius: 999px; border: 1px solid var(--border);
    background: #FFF; color: var(--text); width: 220px;
  }

  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #FFFFFF; touch-action: none; }
  #drawCanvas { position: absolute; inset: 0; touch-action: none; display: block; }

  #toolbar {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .row::-webkit-scrollbar { display: none; }

  .tool-btn {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid var(--border); background: #FAFAF7;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text);
  }
  .tool-btn.active { background: var(--accent); color: #FFF; border-color: var(--accent); }

  .brush-btn { width: 58px; height: 54px; flex-direction: column; gap: 3px; padding: 5px 4px; }
  .brush-thumb { width: 100%; height: 20px; border-radius: 4px; background: #FFFFFF; display: block; }
  .brush-label { font-size: 9px; color: var(--text-secondary); line-height: 1; }
  .brush-btn.active .brush-label { color: #FFFFFF; }

  #colorPickerNative {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--border); padding: 0; overflow: hidden;
    touch-action: auto;
  }
  #bgColorPicker {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px;
    border: 2px solid var(--border); padding: 0; overflow: hidden;
    touch-action: auto;
  }
  #currentColorPreview {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--border);
  }
  #sizeSlider { flex: 1; min-width: 80px; }
  .label { font-size: 11px; color: var(--text-secondary); flex: 0 0 auto; white-space: nowrap; }

  #undoBtn, #clearBtn {
    font-size: 12px; padding: 8px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: #FAFAF7; color: var(--text); flex: 0 0 auto;
  }
  #saveBtn {
    font-size: 13px; padding: 9px 18px; border-radius: 999px; border: none;
    background: var(--accent); color: #FFF; flex: 0 0 auto; margin-left: auto;
  }

  .gallery-header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .gallery-header .title { font-size: 15px; font-weight: 600; flex: 1; }
  .gallery-header button {
    font-size: 12px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: #FAFAF7; color: var(--text);
  }

  .profile-header {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .profile-back {
    font-size: 12px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: #FAFAF7; color: var(--text); flex: 0 0 auto;
  }
  .profile-info { flex: 1; display: flex; align-items: center; gap: 10px; }
  .profile-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #C9C4B8, #E2DFD6);
  }
  .profile-count { font-size: 12px; color: var(--text-secondary); }
  .profile-add {
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: var(--accent); color: #FFF; font-size: 20px; line-height: 1;
    flex: 0 0 auto;
  }
  .gallery-list {
    flex: 1; overflow-y: auto; padding: 14px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    align-content: start;
  }
  .work-card {
    background: #FFF; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); position: relative;
  }
  .work-card::after { content: ''; display: block; padding-top: 100%; }
  .work-card-media {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .work-card-media img { max-width: 100%; max-height: 100%; display: block; object-fit: contain; }
  .resonance-btn {
    position: absolute; bottom: 8px; right: 8px; width: 34px; height: 34px;
    border-radius: 50%; border: none; background: rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    transition: transform 0.25s ease;
  }
  .resonance-btn.pulsed { transform: scale(1.3); }
  .empty-hint { grid-column: 1 / -1; text-align: center; color: var(--text-secondary); font-size: 13px; padding: 40px 0; }

  #detailModal {
    position: fixed; inset: 0; background: rgba(20,18,14,0.9);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  #detailModal.active { display: flex; }
  #detailModal img { max-width: 100%; max-height: 75vh; border-radius: 8px; }
  #detailModal .detail-close {
    position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.15); color: #FFF; font-size: 18px;
  }
  #detailModal .detail-prompt { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div id="app">

  <div id="screen-intro" class="screen active">
    <div class="center-content">
      <h1>IKKUNA</h1>
      <p class="prompt-label">本週的題目</p>
      <p class="prompt-text" id="introPromptText">—</p>
      <p style="font-size:12px;color:var(--text-secondary);margin:-20px 0 28px;">會依序收到三段提問，各自畫下你想像中的畫面</p>
      <button class="primary-btn" id="startBtn">開始</button>
    </div>
  </div>

  <div id="screen-tutorial" class="screen">
    <div class="center-content">
      <h1>先熟悉一下畫布</h1>
      <p>試著換換看筆刷、顏色、工具，隨便畫都可以。<br>這裡畫的東西不會被保存。</p>
      <button class="primary-btn" id="tutorialStartBtn">開始練習</button>
      <button class="secondary-btn" id="tutorialSkipBtn">跳過教學</button>
    </div>
  </div>

  <div id="screen-draw" class="screen">
    <div id="promptBanner"><span id="promptStepLabel"></span><span id="drawPromptText"></span></div>
    <div id="canvasWrap">
      <canvas id="drawCanvas"></canvas>
    </div>
    <div id="toolbar">
      <div class="row" id="toolRow">
        <button class="tool-btn active" data-tool="pen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21l1.2-4.8L15.5 4.9a1.7 1.7 0 0 1 2.4 0l1.2 1.2a1.7 1.7 0 0 1 0 2.4L7.8 19.8 3 21z"/>
            <path d="M13.5 6.9l3.6 3.6"/>
          </svg>
        </button>
        <button class="tool-btn" data-tool="eraser">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M16.24 3.56a2 2 0 0 1 2.83 0l1.37 1.37a2 2 0 0 1 0 2.83L9.88 19.32a2 2 0 0 1-1.32.58H4a1 1 0 0 1-1-1v-4.56a2 2 0 0 1 .58-1.32L16.24 3.56z"/>
          </svg>
        </button>
        <button class="tool-btn" data-tool="line">／</button>
        <button class="tool-btn" data-tool="rect">▭</button>
        <button class="tool-btn" data-tool="circle">◯</button>
        <span class="label">筆刷：</span>
        <button class="tool-btn brush-btn active" data-brush="smooth">
          <canvas class="brush-thumb" data-thumb="smooth" width="88" height="40"></canvas>
          <span class="brush-label">滑順</span>
        </button>
        <button class="tool-btn brush-btn" data-brush="chalk">
          <canvas class="brush-thumb" data-thumb="chalk" width="88" height="40"></canvas>
          <span class="brush-label">粉筆</span>
        </button>
        <button class="tool-btn brush-btn" data-brush="spray">
          <canvas class="brush-thumb" data-thumb="spray" width="88" height="40"></canvas>
          <span class="brush-label">噴槍</span>
        </button>
        <button class="tool-btn brush-btn" data-brush="marker">
          <canvas class="brush-thumb" data-thumb="marker" width="88" height="40"></canvas>
          <span class="brush-label">麥克筆</span>
        </button>
        <button class="tool-btn brush-btn" data-brush="watercolor">
          <canvas class="brush-thumb" data-thumb="watercolor" width="88" height="40"></canvas>
          <span class="brush-label">水彩</span>
        </button>
      </div>

      <div class="row" id="colorRow">
        <input type="color" id="colorPickerNative" value="#2A2A28">
        <span id="currentColorPreview"></span>
        <span class="label">畫布</span>
        <input type="color" id="bgColorPicker" value="#FFFFFF">
        <span class="label">粗細</span>
        <input type="range" id="sizeSlider" min="1" max="40" value="6">
      </div>

      <div class="row">
        <button id="backFromDrawBtn">← 返回</button>
        <button id="undoBtn">復原</button>
        <button id="clearBtn">清空</button>
        <button id="saveBtn">保存這件作品</button>
      </div>
    </div>
  </div>

  <div id="screen-saved" class="screen">
    <div class="center-content">
      <h1>已保存</h1>
      <p>這件作品已經留下了。<br>你可以再畫一件，或去看看大家的窗。</p>
      <button class="primary-btn" id="drawAnotherBtn">再畫一件</button>
      <button class="secondary-btn" id="goGalleryBtn">去看看大家的窗</button>
    </div>
  </div>

  <div id="screen-gallery" class="screen">
    <div class="gallery-header">
      <span class="title" id="galleryTitle">IKKUNA</span>
      <button id="myWorksBtn">我的主頁</button>
    </div>
    <div id="galleryList" class="gallery-list"></div>
  </div>

  <div id="screen-mywork" class="screen">
    <div class="profile-header">
      <button id="backToGalleryBtn" class="profile-back">← 首頁</button>
      <div class="profile-info">
        <div class="profile-avatar"></div>
        <span class="profile-count"></span>
      </div>
      <button id="addWorkBtn" class="profile-add">＋</button>
    </div>
    <div class="row" id="exportRow" style="padding:8px 16px 0;display:none;">
      <button id="exportDataBtn" style="font-size:11px;padding:6px 12px;border-radius:999px;border:1px solid #E2DFD6;background:#FAFAF7;color:#8A8778;">匯出資料給 p5.js 使用</button>
      <button id="clearDataBtn" style="font-size:11px;padding:6px 12px;border-radius:999px;border:1px solid #E2DFD6;background:#FAFAF7;color:#C0392B;">清除本機所有作品資料</button>
    </div>
    <div id="myWorkList" class="gallery-list"></div>
  </div>

</div>

<div id="detailModal">
  <button class="detail-close" id="detailCloseBtn">✕</button>
  <div>
    <img id="detailImage" src="">
    <p class="detail-prompt" id="detailPromptText"></p>
  </div>
</div>

<script>
(function () {
  // ============================================================
  // ============================================================
  // 主題庫：12 個主題，每個主題底下 3 段提問，依週輪替，
  // 同一週所有人看到的是同一個主題
  // ============================================================
  const WEEKLY_THEMES = [
    { title: '沒對上的頻率', prompts: [
      '兩個聲音想合在一起，卻總是差那麼一點點，一個快了半拍，一個慢了半拍，怎麼調都對不上。這在你腦海中是什麼畫面？你會用什麼顏色、什麼樣的筆觸或形狀表現？',
      '一開始只是一點點對不上的地方，沒有人放在心上，直到「他」越來越有存在感，變成怎麼樣都繞不開的障礙。「他」會是什麼呢？會如何跟周遭互動呢？',
      '就在某一個瞬間，兩個聲音突然疊在一起了，準確得讓人意外。你會如何去想像這一刻意外的畫面？'
    ]},
    { title: '被剪裁過的自己', prompts: [
      '「他」往外前進著、前進著，中途好像經過了一層看不見的空氣，再被接收時，已經跟原本不太一樣了。「他」是如何行進、變化的呢？',
      '被放在不屬於它的地方，好不容易脫離了，卻還是留下一點痕跡。你會用什麼顏色、筆觸或形狀，詮釋這個「痕跡」呢？',
      '有一個部分，一直想從角落露出來，想被真正看見，而不是被這個不屬於他的地方湮沒。他在哪裡呢？又是被什麼埋沒了呢？'
    ]},
    { title: '沒有回音的房間', prompts: [
      '在一個空間裡發出聲響，聲音傳出去，卻沒有任何回音傳回來。這是一個什麼樣的畫面呢？你會用什麼顏色、什麼樣的筆觸或形狀來形容它？',
      '明明都站在同一個空間裡，中間卻隔著一段看得見、卻怎麼也過不去的障礙。這是一個什麼樣的空間呢？你如何想像這個場景呢？',
      '沉默的溫度冷得刺骨。你會怎麼詮釋這個極寒的感觸呢？'
    ]},
    { title: '說不出口的「不」', prompts: [
      '他如鯁在喉，卻怎麼樣都沒辦法排除。「他」在你腦海中是什麼呢？',
      '每一次把「他」壓下去，就又變得更重一點，一次一次加起來，越來越沉。「他」是什麼樣子呢？一次次加起來又是什麼畫面？',
      '終於有一次，他衝了出來，而那個瞬間，突然覺得輕鬆了些。你會怎麼詮釋這個「輕鬆」的感覺？'
    ]},
    { title: '被拉住的重量', prompts: [
      '被什麼東西輕輕拉著，而沒辦法完全往前走，那個重量如影隨形。是什麼拉著呢？',
      '那股拉力慢慢長出了「他」——一種說不清楚、卻讓人更難掙脫的感覺。「他」是什麼樣子呢？又是如何纏住的？',
      '有一個瞬間，真的很想甩開他前進。你會如何想像這個掙脫的畫面？'
    ]},
    { title: '沒有門的房間', prompts: [
      '有一個非密閉空間，從來沒有機會關上。這是一個什麼樣的空間？你會用什麼顏色、筆觸或形狀描繪它？',
      '有個外來的感覺，不斷落在不屬於它的地方，令人不自在。這個感覺你會怎麼形容、具象化？它從哪裡來、又落在哪裡？',
      '終於有一次，終於關上了那個空間，關上的那一刻，空間第一次真正屬於自己。你會怎麼想像這個「關上」的畫面？'
    ]},
    { title: '接不住的話', prompts: [
      '有什麼東西不斷向下墜落，似乎要到觸底了，卻還是沒有停下來，繼續往下墜。這是一個什麼樣的畫面？你會用什麼顏色、筆觸或形狀表現它？',
      '墜落的途中，想像過千百次能夠被接住，每一次想像的姿勢都不太一樣，但那個瞬間始終沒有出現。會是什麼接住了呢？又會出現在哪裡？',
      '觸底的聲音，比想像中安靜太多，安靜到懷疑是不是真的停止墜落了。你會怎麼詮釋這個「安靜」？'
    ]},
    { title: '別人眼中的自己', prompts: [
      '一個感覺，被重複提起了好多次，每一次提到，感覺都更清晰一點。這是什麼樣的感覺？你會怎麼將他具象化？',
      '想像著外來的「他」在思緒中繞來繞去，怎麼甩都甩不掉。「他」是什麼人？還是什麼物件？又是怎麼繞來繞去呢？',
      '如果有一刻真的可以放下一切，完全不需在意了，那會是什麼感覺？你會怎麼想像這個放下的瞬間？'
    ]},
    { title: '圈子外的一步', prompts: [
      '矗立在一個看起來很快樂的空間外面一步的距離，看得到、卻怎麼樣也走不進去。是什麼矗立著呢？這是一個什麼樣的空間？',
      '繁雜之中尋找一個安心舒適的位置，找了很久，卻怎麼樣都找不到。這個「位置」會是什麼樣子呢？你如何想像尋找的過程？',
      '有一刻，這個安心的位置出現了，已經不需要再尋找。這個「位置」又是如何出現的呢？'
    ]},
    { title: '碎掉的約定', prompts: [
      '一個原本完整的東西，不知道從什麼時候開始，出現了損傷。這是什麼東西呢？又是如何受損的？',
      '曾經那麼信仰的真理，直到那一刻，才發現一切都是虛假的。這個「真理」會是什麼樣子？而他又怎麼虛假呢？',
      '損傷之後，還是有一些東西留了下來，沒有完全毀滅。留下來的會是什麼呢？你會用什麼顏色、筆觸或形狀表現它？'
    ]},
    { title: '被搶走的位置', prompts: [
      '同時渴望著同一個東西，一瞬間，不確定他會被怎麼拿下。這個東西是什麼呢？你會怎麼具象化這個「不確定」的感覺？',
      '明明是一路付出心血的成果，卻在某一刻，被拿走了。「成果」被拿走時是什麼樣子？又是被誰、怎麼拿走的呢？',
      '後來，在一片空白中，重新創造了充滿意義的東西，看著它一點一點長大。它會長成什麼樣子呢？又是在什麼樣的地方生長的？'
    ]},
    { title: '看不見的繩子', prompts: [
      '有什麼東西纏繞，一開始很鬆，鬆到幾乎感覺不到，但漸漸地，它收緊了一點。這個東西是什麼？他是如何由鬆變緊了呢？',
      '動一下，它就又收緊一點，好像有什麼一直在旁邊注意著每一個動作。這道「注意」會是什麼樣子？又是從哪裡來的呢？',

  // ============================================================
  // 第一階段運算 v2：每個主題（本週題目）有自己專屬的視覺演算法，
  // 用實際繪圖產生的數據（顏色、筆刷、形狀/工具、位置、方向、背景色）當參數，
  // 最終輸出一段真正會動的 GIF，縮圖跟點開後看到的都是這支 GIF。
  // ============================================================
  const GIF_SIZE = 280;

  // ---- 把筆畫資料抽成一組通用參數，給各主題演算法使用 ----
  function extractDrawingParams(strokesArr, bgColor) {
    const colorCounts = {}, brushCounts = {}, toolCounts = {};
    let sumDx = 0, sumDy = 0, dirCount = 0;
    let speedSum = 0, curvSum = 0, n = 0;
    let sizeSum = 0, sizeCount = 0;
    let sumPX = 0, sumPY = 0, posCount = 0;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

    strokesArr.forEach(s => {
      colorCounts[s.color] = (colorCounts[s.color] || 0) + 1;
      brushCounts[s.brush] = (brushCounts[s.brush] || 0) + 1;
      toolCounts[s.tool] = (toolCounts[s.tool] || 0) + 1;
      const m = s.metrics || {};
      speedSum += (m.avgSpeed || 0.3); curvSum += (m.avgCurvature || 0); n++;
      sizeSum += (s.size || 6); sizeCount++;
      for (let i = 1; i < s.points.length; i++) {
        sumDx += s.points[i].x - s.points[i - 1].x;
        sumDy += s.points[i].y - s.points[i - 1].y;
        dirCount++;
      }
      s.points.forEach(p => {
        sumPX += p.x; sumPY += p.y; posCount++;
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      });
    });

    const colors = Object.keys(colorCounts);
    const sortedColors = colors.sort((a, b) => colorCounts[b] - colorCounts[a]);
    // 畫面位置：這批筆畫的重心落在整體範圍的哪裡（0~1），偏左/偏右、偏上/偏下
    const centroidX = posCount > 0 && maxX > minX ? (sumPX / posCount - minX) / (maxX - minX) : 0.5;
    const centroidY = posCount > 0 && maxY > minY ? (sumPY / posCount - minY) / (maxY - minY) : 0.5;

    return {
      colors: sortedColors.length ? sortedColors : ['#2A2A28'],
      dominantColor: sortedColors[0] || '#2A2A28',
      colorCount: sortedColors.length,
      dominantBrush: Object.keys(brushCounts).sort((a, b) => brushCounts[b] - brushCounts[a])[0] || 'smooth',
      dominantTool: Object.keys(toolCounts).sort((a, b) => toolCounts[b] - toolCounts[a])[0] || 'pen',
      avgDir: dirCount > 0 ? Math.atan2(sumDy / dirCount, sumDx / dirCount) : 0,
      avgSpeed: n > 0 ? speedSum / n : 0.3,
      avgCurv: n > 0 ? curvSum / n : 0,
      avgSize: sizeCount > 0 ? sizeSum / sizeCount : 6,
      centroidX: centroidX, centroidY: centroidY,
      strokeCount: strokesArr.length,
      bgColor: bgColor || '#FFFFFF',
      toolCounts: toolCounts,
      brushCounts: brushCounts,
      hasEraser: !!toolCounts['eraser']
    };
  }

  function hexToRgbArr(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
  }
  function isColorDark(hex) {
    const [r, g, b] = hexToRgbArr(hex);
    return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
  }
  function mixColor(hexA, hexB, t) {
    const pa = hexToRgbArr(hexA), pb = hexToRgbArr(hexB);
    const r = Math.round(pa[0] * (1 - t) + pb[0] * t);
    const g = Math.round(pa[1] * (1 - t) + pb[1] * t);
    const b = Math.round(pa[2] * (1 - t) + pb[2] * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ---- 把原始座標等比例縮放置中，供需要用到實際筆畫幾何形狀的演算法使用 ----
  function scaleStrokesForRender(strokesArr, targetSize) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    strokesArr.forEach(s => s.points.forEach(p => {
      minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    }));
    if (minX === Infinity) { minX = 0; minY = 0; maxX = targetSize; maxY = targetSize; }
    const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
    const pad = targetSize * 0.1;
    const scale = Math.min((targetSize - pad * 2) / w, (targetSize - pad * 2) / h);
    const offX = (targetSize - w * scale) / 2, offY = (targetSize - h * scale) / 2;
    const tp = (p) => ({ x: (p.x - minX) * scale + offX, y: (p.y - minY) * scale + offY });
    return strokesArr.map(s => ({ color: s.color, metrics: s.metrics, size: s.size * scale, points: s.points.map(tp) }));
  }

  // ============ 通用備援流派（尚未客製化的題目先用這套，會加上簡單動態） ============
  function decideGenre(strokesArr) {
    let speedSum = 0, curvSum = 0, n = 0;
    strokesArr.forEach(s => {
      const m = s.metrics || {};
      speedSum += (m.avgSpeed || 0.3); curvSum += (m.avgCurvature || 0); n++;
    });
    const avgSpeed = n > 0 ? speedSum / n : 0.3;
    const avgCurv = n > 0 ? curvSum / n : 0;
    if (avgCurv > 0.35) return 'flower';
    if (avgSpeed > 0.55) return 'confetti';
    if (avgSpeed < 0.3 && avgCurv < 0.25) return 'glow';
    return 'flow';
  }

  function drawGenreFlower(strokes, size) {
    ctx.fillStyle = '#EAF4EE';
    ctx.fillRect(0, 0, size, size);
    strokes.forEach(s => {
      const pts = s.points;
      const cx = pts.reduce((a, p) => a + p.x, 0) / pts.length;
      const cy = pts.reduce((a, p) => a + p.y, 0) / pts.length;
      let pathLen = 0;
      for (let i = 1; i < pts.length; i++) pathLen += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      const petalR = Math.max(14, Math.min(60, pathLen * 0.05 + s.size));
      const petals = 5 + Math.floor((s.metrics && s.metrics.avgCurvature || 0) * 4);
      for (let i = 0; i < petals; i++) {
        const a = (i / petals) * Math.PI * 2;
        ctx.fillStyle = hexToRgba(s.color, 0.9);
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * petalR * 0.8, cy + Math.sin(a) * petalR * 0.8, petalR * 0.65, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = hexToRgba(s.color, 1);
      ctx.beginPath(); ctx.arc(cx, cy, petalR * 0.45, 0, Math.PI * 2); ctx.fill();
    });
  }

  function drawGenreConfetti(strokes, size) {
    ctx.fillStyle = '#0C0C10';
    ctx.fillRect(0, 0, size, size);
    strokes.forEach(s => {
      const speed = (s.metrics && s.metrics.avgSpeed) || 0.5;
      const n = Math.max(4, Math.round(s.points.length / 3));
      for (let i = 0; i < n; i++) {
        const p = s.points[Math.floor((i / n) * (s.points.length - 1))];
        const shapeSize = s.size * (1.2 + Math.random() * 1.8) * (0.6 + speed);
        const type = Math.floor(Math.random() * 3);
        ctx.save();
        ctx.translate(p.x + (Math.random() - 0.5) * shapeSize, p.y + (Math.random() - 0.5) * shapeSize);
        ctx.rotate(Math.random() * Math.PI * 2);
        ctx.fillStyle = hexToRgba(s.color, 0.9);
        if (type === 0) ctx.fillRect(-shapeSize / 2, -shapeSize / 2, shapeSize, shapeSize);
        else if (type === 1) { ctx.beginPath(); ctx.arc(0, 0, shapeSize / 2, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(0, -shapeSize / 2); ctx.lineTo(shapeSize / 2, shapeSize / 2); ctx.lineTo(-shapeSize / 2, shapeSize / 2); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      }
    });
  }

  function drawGenreGlow(strokes, size) {
    ctx.fillStyle = '#0A0A0C';
    ctx.fillRect(0, 0, size, size);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    strokes.forEach(s => {
      const pts = s.points;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = hexToRgba(s.color, 0.5);
      ctx.lineWidth = s.size * 3.2;
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.lineWidth = s.size * 1.2;
      ctx.strokeStyle = hexToRgba(s.color, 0.85);
      ctx.stroke();
    });
    ctx.restore();
  }

  function drawGenreFlow(strokes, size) {
    ctx.fillStyle = '#F5F3EE';
    ctx.fillRect(0, 0, size, size);
    strokes.forEach(s => {
      const pts = s.points;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = hexToRgba(s.color, 0.18);
      ctx.lineWidth = s.size * 2.4;
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      ctx.strokeStyle = hexToRgba(s.color, 0.9);
      ctx.lineWidth = s.size;
      ctx.stroke();
    });
  }

  // ============ 主題專屬演算法（示範，先做 5 個，其餘沿用備援流派） ============
  // 索引對應 PROMPTS 陣列：0尚未癒合的地方 3漂浮 6退潮 7裂縫裡的光 13停在半空中

  // ============ 主題專屬演算法 v2：每個參數在這個主題下都有具體的含義 ============

  // 【尚未癒合的地方】
  // 轉彎弧度→傷口破碎/整齊的程度；速度→脈動快慢（焦慮或平靜）；
  // 運筆方向→傷口的角度；有沒有用過橡皮擦→這一輪循環裡傷口是否逐漸癒合；
  // 筆畫數→傷口的數量（最多3條）
  function theme_wound(progress, params) {
    ctx.fillStyle = params.bgColor; ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);
    const cx = GIF_SIZE / 2, cy = GIF_SIZE / 2;
    const healProgress = params.hasEraser ? progress : 0; // 用過橡皮擦＝有嘗試修復，這輪會漸漸癒合
    const baseGap = Math.max(2, 10 - params.avgCurv * 8) * (1 - healProgress * 0.7);
    const pulse = Math.sin(progress * Math.PI * 2 * (0.5 + params.avgSpeed)) * (2 + params.avgCurv * 6);
    const gap = baseGap + pulse;
    const len = GIF_SIZE * 0.55;
    const wounds = Math.max(1, Math.min(3, params.strokeCount));
    for (let w = 0; w < wounds; w++) {
      ctx.save();
      ctx.translate(cx, cy + (w - (wounds - 1) / 2) * 40);
      ctx.rotate(params.avgDir);
      ctx.strokeStyle = hexToRgba(params.dominantColor, 0.85 - healProgress * 0.4);
      ctx.lineWidth = 2 + params.strokeCount * 0.2;
      ctx.beginPath(); ctx.moveTo(-len / 2, -gap / 2); ctx.lineTo(len / 2, -gap / 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-len / 2, gap / 2); ctx.lineTo(len / 2, gap / 2); ctx.stroke();
      ctx.restore();
    }
  }

  // 【漂浮】
  // 運筆方向的垂直分量→往上畫代表想飄走的意志（升得快），往下畫代表被拉住飄不起來；
  // 轉彎弧度→飄浮路徑搖不搖晃（猶豫程度）；速度→上升的急促程度；
  // 筆刷質感→氣泡的邊緣觸感（水彩=朦朧、麥克筆=清楚、其他=一般）；
  // 筆畫數→氣泡數量；用色→氣泡輪流套用實際用過的顏色
  function theme_float(progress, params) {
    ctx.fillStyle = mixColor(params.bgColor, '#EAF6FB', 0.5); ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);
    const colors = params.colors;
    const n = Math.min(20, Math.max(6, params.strokeCount * 3));
    const riseBias = Math.max(0.3, 1 - Math.sin(params.avgDir) * 0.6);
    const wobble = params.avgCurv;
    const brushAlpha = params.dominantBrush === 'watercolor' ? 0.35 : params.dominantBrush === 'marker' ? 0.75 : 0.55;
    for (let i = 0; i < n; i++) {
      const seed = i * 37.1;
      const speedFactor = 0.4 + params.avgSpeed * riseBias;
      const y = (1 - ((progress * speedFactor + i / n) % 1)) * GIF_SIZE;
      const wobbleX = Math.sin(progress * Math.PI * 4 + seed) * (8 + wobble * 20);
      const x = (Math.sin(seed) * 0.4 + 0.5) * GIF_SIZE + wobbleX;
      const r = 5 + (i % 4) * 4 + params.avgSpeed * 8;
      ctx.fillStyle = hexToRgba(colors[i % colors.length], brushAlpha);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 【退潮】
  // 運筆方向的水平分量→往右畫代表潮水真的退去（順著主題），往左畫代表退了又捨不得拉回來（矛盾）；
  // 轉彎弧度→水面波動的劇烈程度；速度→退潮快慢；
  // 色帶數量→筆畫數；用色→水面色帶輪流套用實際用過的顏色
  function theme_tide(progress, params) {
    ctx.fillStyle = mixColor(params.bgColor, '#F2EFE6', 0.5); ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);
    const colors = params.colors;
    const bands = Math.max(3, Math.min(9, params.strokeCount + 2));
    const outward = Math.cos(params.avgDir);
    const recedeSpeed = 0.3 + params.avgSpeed * 0.5;
    for (let i = 0; i < bands; i++) {
      const y = GIF_SIZE * (i / bands) + Math.sin(progress * Math.PI * 2 * (1 + params.avgCurv) + i) * (4 + params.avgCurv * 8);
      let recede = ((progress * recedeSpeed) % 1) * GIF_SIZE;
      if (outward < 0) recede = GIF_SIZE - recede;
      const bandWidth = outward >= 0 ? GIF_SIZE - recede : recede;
      const bandX = outward >= 0 ? 0 : GIF_SIZE - bandWidth;
      ctx.fillStyle = hexToRgba(colors[i % colors.length], 0.35);
      ctx.fillRect(bandX, y, bandWidth, GIF_SIZE / bands * 0.8);
    }
  }

  // 【裂縫裡的光】
  // 筆刷質感→光是否閃爍（粉筆/噴槍等顆粒系筆刷＝不穩定的光，其他＝穩定的光）；
  // 轉彎弧度→裂縫的曲折程度；運筆方向→裂縫延伸的偏移方向；
  // 速度→光的亮暗變化快慢；筆畫數→裂縫條數（最多3條）；
  // 麥克筆＝裂縫較粗、較篤定
  function theme_crack(progress, params) {
    ctx.fillStyle = mixColor(params.bgColor, '#0B0B0D', 0.85); ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);
    const flicker = params.dominantBrush === 'chalk' || params.dominantBrush === 'spray';
    const glowBase = 0.4 + 0.3 * Math.sin(progress * Math.PI * 2 * (flicker ? 3 : 1));
    const glow = flicker ? glowBase * (0.7 + Math.random() * 0.3) : glowBase;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cracks = Math.max(1, Math.min(3, params.strokeCount));
    for (let c = 0; c < cracks; c++) {
      ctx.strokeStyle = hexToRgba(params.dominantColor, glow);
      ctx.lineWidth = (3 + params.avgSpeed * 4) * (params.dominantBrush === 'marker' ? 1.4 : 1);
      ctx.beginPath();
      let x = GIF_SIZE * (0.3 + c * 0.2), y = 0;
      ctx.moveTo(x, y);
      const jag = 20 + params.avgCurv * 60;
      for (let i = 1; i <= 8; i++) {
        x += Math.sin(i * 7 + params.avgDir + c) * jag;
        y = GIF_SIZE * (i / 8);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // 【停在半空中】
  // 速度→懸浮時的顫抖程度；轉彎弧度→是否搖晃翻轉（猶豫）；
  // 運筆方向→整體傾斜方向（想往哪裡去卻去不了）；
  // 筆刷質感→形狀的質地（麥克筆=堅定實心、水彩=朦朧半透明、其他=一般）
  function theme_suspended(progress, params) {
    ctx.fillStyle = mixColor(params.bgColor, '#EFEFEF', 0.6); ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);
    const tremor = params.avgSpeed * 8;
    const bob = Math.sin(progress * Math.PI * 2) * (4 + tremor);
    const wobbleRot = params.avgCurv * Math.sin(progress * Math.PI * 2) * 0.3;
    const leanX = Math.cos(params.avgDir) * 10, leanY = Math.sin(params.avgDir) * 10;
    ctx.save();
    ctx.translate(GIF_SIZE * 0.5 + leanX, GIF_SIZE * 0.5 + bob + leanY);
    ctx.rotate(wobbleRot);
    const size = 34 + params.avgSpeed * 16;
    if (params.dominantBrush === 'watercolor') {
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.3);
      grad.addColorStop(0, hexToRgba(params.dominantColor, 0.5));
      grad.addColorStop(1, hexToRgba(params.dominantColor, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0, 0, size * 1.3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = hexToRgba(params.dominantColor, params.dominantBrush === 'marker' ? 0.92 : 0.75);
      ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ============================================================
  // 共用技法庫：任何主題都可以呼叫這些技法，不綁定特定敘事
  // ============================================================
  function tech_glow(progress, params) {
    const [r, g, b] = hexToRgbArr(params.dominantColor);
    const n = 1 + Math.round((r / 255) * 18); // 數量 1~19，範圍拉大
    const spread = 4 + (b / 255) * 70; // 大小 4~74，範圍拉大
    const orbitRadius = GIF_SIZE * (0.06 + (g / 255) * 0.44); // 分布範圍 0.06~0.5 倍畫布
    const orbitSpeed = 0.25 + params.avgSpeed * 3.2; // 移動速度範圍拉大
    for (let i = 0; i < n; i++) {
      const phase = i * 1.7;
      const x = GIF_SIZE / 2 + Math.cos(phase + progress * Math.PI * 2 * orbitSpeed) * orbitRadius;
      const y = GIF_SIZE / 2 + Math.sin(phase * 1.3 + progress * Math.PI * 2 * orbitSpeed * 1.3) * orbitRadius * 0.85;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, spread);
      grad.addColorStop(0, hexToRgba(params.dominantColor, 0.4));
      grad.addColorStop(1, hexToRgba(params.dominantColor, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, spread, 0, Math.PI * 2); ctx.fill();
    }
  }

  function tech_packing(progress, params) {
    const cx = GIF_SIZE / 2, cy = GIF_SIZE / 2;
    const gapAngle = params.avgDir + progress * Math.PI * 0.3;
    const gapSize = 10 + params.avgCurv * 70; // 缺口大小範圍拉大：10~80
    const count = Math.round(12 + params.strokeCount * 3 + params.avgSpeed * 25); // 圓的數量範圍拉大
    const sizeMin = 2 + params.avgSpeed * 3, sizeRange = 6 + params.avgCurv * 20; // 圓的大小範圍拉大
    let seed = 17;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (let i = 0; i < count; i++) {
      const ang = rnd() * Math.PI * 2, dist = Math.sqrt(rnd()) * GIF_SIZE * 0.42;
      const x = cx + Math.cos(ang) * dist, y = cy + Math.sin(ang) * dist;
      let d = Math.abs(((ang - gapAngle + Math.PI) % (Math.PI * 2)) - Math.PI);
      if (d < 0.3 && dist < gapSize + 36) continue;
      ctx.fillStyle = hexToRgba(params.dominantColor, 0.2 + rnd() * 0.3);
      ctx.beginPath(); ctx.arc(x, y, sizeMin + rnd() * sizeRange, 0, Math.PI * 2); ctx.fill();
    }
  }

  function tech_flock(progress, params) {
    const cx = GIF_SIZE / 2, cy = GIF_SIZE / 2;
    const baseR = GIF_SIZE * (0.06 + params.avgCurv * 0.38); // 軌道半徑範圍拉大：0.06~0.44 倍畫布
    const wobbleAmp = GIF_SIZE * (0.02 + params.avgCurv * 0.3); // 擺動幅度範圍拉大
    const angSpeed = 0.4 + params.avgSpeed * 6; // 角速度範圍拉大：0.4~6.4
    const trailLen = Math.round(4 + params.avgSpeed * 16); // 拖尾長度隨速度變化：4~20
    const dotSize = 3 + params.avgSpeed * 12; // 主體大小範圍拉大
    for (let k = trailLen; k >= 0; k--) {
      const tp = progress - k * 0.015;
      const r2 = baseR + Math.sin(tp * Math.PI * 2 * (1 + params.avgSpeed * 3)) * wobbleAmp;
      const a = tp * Math.PI * 2 * angSpeed + params.avgDir;
      const x = cx + Math.cos(a) * r2, y = cy + Math.sin(a) * r2 * 0.7;
      const alpha = k === 0 ? 0.75 : 0.05 * (1 - k / (trailLen + 1));
      ctx.fillStyle = hexToRgba(params.dominantColor, alpha);
      ctx.beginPath(); ctx.arc(x, y, k === 0 ? dotSize : 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function tech_branch(progress, params) {
    const growT = 0.5 + Math.sin(progress * Math.PI * 2 * (1 + params.avgSpeed * 2)) * (0.15 + params.avgCurv * 0.35);
    const branches = Math.min(14, Math.max(1, Math.round(1 + params.strokeCount * 1.4))); // 1~14 條，範圍拉大
    const maxLen = GIF_SIZE * (0.1 + params.avgSpeed * 0.6); // 長度 0.1~0.7 倍畫布，差異拉大
    const depth = Math.min(7, Math.max(2, Math.round(2 + params.avgCurv * 5))); // 分岔複雜度 2~7 層
    const spreadAngle = 0.06 + params.avgCurv * 0.75; // 分岔角度範圍拉大，弧度低=幾乎直線，弧度高=劇烈展開
    function db(x, y, angle, len, d) {
      if (d <= 0 || len < 3) return;
      const x2 = x + Math.cos(angle) * len, y2 = y + Math.sin(angle) * len;
      ctx.strokeStyle = hexToRgba(params.dominantColor, 0.14 + d * 0.08);
      ctx.lineWidth = Math.max(0.5, d * (0.4 + params.avgSpeed * 0.7));
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
      db(x2, y2, angle - spreadAngle, len * 0.62, d - 1);
      db(x2, y2, angle + spreadAngle, len * 0.62, d - 1);
    }
    for (let i = 0; i < branches; i++) {
      const spread = (i - (branches - 1) / 2) * (0.05 + params.avgCurv * 0.3);
      db(GIF_SIZE * 0.5, GIF_SIZE * 0.5, params.avgDir + spread, maxLen * growT, depth);
    }
  }

  function tech_gridspin(progress, params) {
    const [r, g, b] = hexToRgbArr(params.dominantColor);
    const cols = 4 + Math.round((r / 255) * 4), rows = cols;
    const cw = GIF_SIZE / cols, ch = GIF_SIZE / rows;
    const radius = 3 + (g / 255) * 6, phaseVar = 1 + (b / 255) * 3;
    const speed = 0.5 + params.avgSpeed * 3;
    for (let cy2 = 0; cy2 < rows; cy2++) {
      for (let cx2 = 0; cx2 < cols; cx2++) {
        const ccx = cw * (cx2 + 0.5), ccy = ch * (cy2 + 0.5);
        const phase = (cx2 * 1.3 + cy2 * 1.7) * phaseVar;
        const ang = progress * Math.PI * 2 * speed + phase;
        const rad = radius * (0.7 + params.avgCurv);
        ctx.fillStyle = hexToRgba(params.dominantColor, 0.28);
        ctx.beginPath(); ctx.arc(ccx + Math.cos(ang) * rad, ccy + Math.sin(ang) * rad, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function tech_bands(progress, params) {
    const colors = params.colors;
    const bands = Math.max(2, Math.min(14, Math.round(2 + params.strokeCount * 1.3))); // 2~14 條，範圍拉大
    const outward = Math.cos(params.avgDir);
    const fillFactor = 0.2 + params.avgCurv * 0.7; // 帶狀粗細 0.2~0.9 倍，細絲到近乎滿版都有可能
    const recedeSpeedFactor = 0.12 + params.avgSpeed * 0.85; // 移動速度範圍拉大
    const waveAmp = params.avgCurv * 22; // 波動幅度：弧度低=近乎死板水平，弧度高=劇烈起伏
    for (let i = 0; i < bands; i++) {
      const y = GIF_SIZE * (i / bands) + Math.sin(progress * Math.PI * 2 * (1 + params.avgCurv * 2) + i) * waveAmp;
      let recede = ((progress * recedeSpeedFactor) % 1) * GIF_SIZE;
      if (outward < 0) recede = GIF_SIZE - recede;
      const w = outward >= 0 ? GIF_SIZE - recede : recede;
      const x = outward >= 0 ? 0 : GIF_SIZE - w;
      ctx.fillStyle = hexToRgba(colors[i % colors.length], 0.2 + params.avgSpeed * 0.18);
      ctx.fillRect(x, y, w, GIF_SIZE / bands * fillFactor);
    }
  }

  function tech_pathshapes(progress, params) {
    const n = 8 + Math.round(params.avgSpeed * 10);
    let seed = 71;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (let i = 0; i < n; i++) {
      const tpos = (i / n + progress * 0.3) % 1;
      const wob = Math.sin(tpos * Math.PI * 6 + params.avgDir) * 40 * params.avgCurv;
      const x = tpos * GIF_SIZE, y = GIF_SIZE / 2 + wob + Math.sin(tpos * Math.PI * 2) * GIF_SIZE * 0.15;
      const s = 6 + rnd() * 10;
      const type = Math.floor(rnd() * 3);
      ctx.save(); ctx.translate(x, y); ctx.rotate(rnd() * Math.PI * 2);
      ctx.fillStyle = hexToRgba(params.dominantColor, 0.5);
      if (type === 0) ctx.fillRect(-s / 2, -s / 2, s, s);
      else if (type === 1) { ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 2); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
  }

  function tech_diffraction(progress, params) {
    const sources = [{ x: GIF_SIZE * 0.3, y: GIF_SIZE * 0.5 }, { x: GIF_SIZE * 0.7, y: GIF_SIZE * 0.5 }];
    const step = 12;
    for (let x = 0; x < GIF_SIZE; x += step) {
      for (let y = 0; y < GIF_SIZE; y += step) {
        let v = 0;
        sources.forEach(s => {
          const d = Math.hypot(x - s.x, y - s.y);
          v += Math.cos(d * 0.15 - progress * Math.PI * 2 * (1 + params.avgSpeed * 2)) / (1 + d * 0.01);
        });
        const bright = Math.max(0, Math.min(1, (v + 1) / 2));
        if (bright > 0.55) {
          ctx.fillStyle = hexToRgba(params.dominantColor, bright * 0.28);
          ctx.fillRect(x, y, step + 1, step + 1);
        }
      }
    }
  }

  function tech_scribble(progress, params) {
    let seed = 203;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    let x = GIF_SIZE * 0.3, y = GIF_SIZE * 0.5;
    ctx.strokeStyle = hexToRgba(params.dominantColor, 0.45);
    ctx.lineWidth = 1.3;
    const steps = Math.round(20 + params.avgCurv * 30);
    const revealTo = (progress * 1.3) % 1;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let i = 0; i < steps; i++) {
      const ang = rnd() * Math.PI * 2, len = 8 + rnd() * 14;
      x += Math.cos(ang) * len; y += Math.sin(ang) * len;
      x = Math.max(10, Math.min(GIF_SIZE - 10, x)); y = Math.max(10, Math.min(GIF_SIZE - 10, y));
      if (i / steps < revealTo) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
  }

  function tech_chart(progress, params) {
    const colW = 8, cols = Math.floor(GIF_SIZE / colW);
    let seed = 305;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (let i = 0; i < cols; i++) {
      const h = (0.3 + rnd() * 0.6) * GIF_SIZE * (0.5 + params.avgSpeed * 0.5) * Math.abs(Math.sin(progress * Math.PI * 2 + i * 0.3));
      ctx.fillStyle = hexToRgba(params.dominantColor, 0.22 + rnd() * 0.28);
      ctx.fillRect(i * colW, GIF_SIZE - h, colW - 1, h);
    }
  }

  const TECH_FUNCS = {
    glow: tech_glow, packing: tech_packing, flock: tech_flock, branch: tech_branch,
    gridspin: tech_gridspin, bands: tech_bands, pathshapes: tech_pathshapes,
    diffraction: tech_diffraction, scribble: tech_scribble, chart: tech_chart
  };

  // 分數式選擇：每種技法用連續數值算分數（不是門檻分類），取分數最高的前幾名疊加。
  // 因為分數是用實際的 RGB 數值、速度數字去算的，即使兩人用同一種筆刷，
  // 只要顏色或速度的精確數值不同，排名結果通常也會不同。
  function techniqueScores(params) {
    const [r, g, b] = hexToRgbArr(params.dominantColor);
    const rn = r / 255, gn = g / 255, bn = b / 255;
    const dx = Math.abs(Math.cos(params.avgDir));
    const dy = Math.abs(Math.sin(params.avgDir));
    const sizeN = Math.min(1, params.avgSize / 30); // 筆刷粗細正規化
    const isShapeTool = params.dominantTool !== 'pen' && params.dominantTool !== 'eraser';
    return {
      glow: 0.12 + params.avgCurv * 0.22 + bn * 0.3 + (params.dominantBrush === 'watercolor' ? 0.22 : 0) + params.centroidY * 0.1,
      packing: 0.1 + (params.dominantBrush === 'chalk' || params.dominantBrush === 'spray' ? 0.4 : 0) + gn * 0.22 + sizeN * 0.18,
      flock: 0.1 + dx * 0.25 + params.avgSpeed * 0.22 + (params.dominantTool === 'circle' ? 0.2 : 0) + (1 - params.centroidX) * 0.1,
      branch: 0.08 + Math.min(1, params.strokeCount / 10) * 0.35 + params.avgCurv * 0.18 + (1 - sizeN) * 0.18,
      gridspin: 0.08 + (1 - params.avgCurv) * 0.22 + rn * 0.22 + (params.dominantTool === 'rect' ? 0.25 : 0) + params.centroidX * 0.1,
      bands: 0.08 + dy * 0.3 + (1 - params.avgSpeed) * 0.18 + sizeN * 0.2,
      pathshapes: 0.08 + params.avgSpeed * 0.28 + (isShapeTool ? 0.28 : 0) + (1 - params.centroidY) * 0.12,
      diffraction: 0.08 + (params.hasClear ? 0.3 : 0) + (1 - params.avgSpeed) * 0.18 + gn * 0.15 + (params.colorCount >= 3 ? 0.12 : 0),
      scribble: 0.08 + params.avgCurv * 0.32 + (params.hasUndo ? 0.22 : 0) + (1 - sizeN) * 0.14,
      chart: 0.08 + params.avgSpeed * 0.26 + rn * 0.2 + (params.hasEraser ? 0.2 : 0) + params.centroidX * 0.12
    };
  }
  function pickTechniques(params, n) {
    const scores = techniqueScores(params);
    return Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, n).map(e => e[0]);
  }

  // ============================================================
  // 三段式作品的合成渲染：三段提問各自獨立畫布、各自的行為數據，
  // 各自從技法庫選出自己分數最高的技法，三層依序疊加成一支 GIF。
  // 第三段（收尾）疊在最上面、份量最重，前兩段份量依序遞減。
  // ============================================================
  function renderMultiStepFrame(progress, stepParamsArr) {
    const bg = stepParamsArr[0].bgColor;
    const dark = isColorDark(bg);
    ctx.fillStyle = dark ? mixColor(bg, '#08080A', 0.6) : mixColor(bg, '#FAF8F3', 0.5);
    ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);
    if (dark) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; }

    const alphas = [0.4, 0.62, 0.95];
    stepParamsArr.forEach((params, i) => {
      const picks = pickTechniques(params, 1);
      ctx.globalAlpha = alphas[i] !== undefined ? alphas[i] : 0.5;
      TECH_FUNCS[picks[0]](progress, params);
    });
    ctx.globalAlpha = 1;

    if (dark) ctx.restore();
  }

  // 【靠近前的猶豫】v7——從技法庫取分數最高的前三名疊加，
  // 猶豫靠近的核心敘事（一個點沿方向軸線來回靠近固定目標）疊在技法之上維持題目可讀性
  function theme_hesitate(progress, params) {
    const dark = isColorDark(params.bgColor);
    ctx.fillStyle = dark ? mixColor(params.bgColor, '#08080A', 0.6) : mixColor(params.bgColor, '#FAF8F3', 0.5);
    ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);
    if (dark) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; }

    const picks = pickTechniques(params, 3);
    ctx.globalAlpha = 1;
    TECH_FUNCS[picks[0]](progress, params);
    ctx.globalAlpha = 0.7;
    TECH_FUNCS[picks[1]](progress, params);
    ctx.globalAlpha = 0.5;
    TECH_FUNCS[picks[2]](progress, params);
    ctx.globalAlpha = 1;

    if (dark) ctx.restore();
  }

  // 【擁擠中的安靜】
  // 技法：網格自轉點錯視（參考 Moving Dot Illusion）——一整片點各自忙碌地繞著
  // 自己的局部圓心轉，只有其中一個安靜不太動，代表人群中安靜的那個自己。
  // R 值→網格密度（人群擁擠程度）；G 值→每個點自轉半徑；B 值→相位差異程度（越亂越不同步）
  // 速度→人群轉動的忙碌程度；轉彎弧度→人群動作的混亂程度
  function theme_crowd_quiet(progress, params) {
    const [r, g, b] = hexToRgbArr(params.dominantColor);
    const rn = r / 255, gn = g / 255, bn = b / 255;
    ctx.fillStyle = mixColor(params.bgColor, '#F3F1EC', 0.6);
    ctx.fillRect(0, 0, GIF_SIZE, GIF_SIZE);

    const cols = 5 + Math.round(rn * 4);
    const rows = cols;
    const cellW = GIF_SIZE / cols, cellH = GIF_SIZE / rows;
    const radius = 4 + gn * 7;
    const phaseVar = 1 + bn * 4;
    const speed = 0.5 + params.avgSpeed * 3;
    const quietCol = Math.floor(cols / 2), quietRow = Math.floor(rows / 2);

    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const centerX = cellW * (cx + 0.5), centerY = cellH * (cy + 0.5);
        const isQuiet = (cx === quietCol && cy === quietRow);
        const phase = (cx * 1.3 + cy * 1.7) * phaseVar;
        const localSpeed = isQuiet ? 0.15 : speed;
        const localRadius = isQuiet ? radius * 0.35 : radius * (0.7 + params.avgCurv);
        const angle = progress * Math.PI * 2 * localSpeed + phase;
        const dx = Math.cos(angle) * localRadius, dy = Math.sin(angle) * localRadius;
        ctx.fillStyle = isQuiet ? hexToRgba(params.dominantColor, 0.95) : hexToRgba(params.dominantColor, 0.32);
        ctx.beginPath();
        ctx.arc(centerX + dx, centerY + dy, isQuiet ? 5 : 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  const THEME_RENDERERS = { 0: theme_wound, 1: theme_crowd_quiet, 2: theme_hesitate, 3: theme_float, 6: theme_tide, 7: theme_crack, 13: theme_suspended };

  function renderThemeFrame(promptIndex, progress, params, scaledStrokes) {
    const custom = THEME_RENDERERS[promptIndex];
    if (custom) { custom(progress, params); return; }
    // 尚未客製化的題目：先用備援流派，加一點呼吸感的縮放動態
    ctx.save();
    ctx.translate(GIF_SIZE / 2, GIF_SIZE / 2);
    const s = 1 + 0.025 * Math.sin(progress * Math.PI * 2);
    ctx.scale(s, s);
    ctx.translate(-GIF_SIZE / 2, -GIF_SIZE / 2);
    const genre = decideGenre(scaledStrokes);
    if (genre === 'flower') drawGenreFlower(scaledStrokes, GIF_SIZE);
    else if (genre === 'confetti') drawGenreConfetti(scaledStrokes, GIF_SIZE);
    else if (genre === 'glow') drawGenreGlow(scaledStrokes, GIF_SIZE);
    else drawGenreFlow(scaledStrokes, GIF_SIZE);
    ctx.restore();
  }

  // ---- 把背景執行緒程式碼抓下來包成本機資源，避免跨網域限制擋下 Worker 建立 ----
  let workerBlobUrlPromise = null;
  function getWorkerBlobUrl() {
    if (!workerBlobUrlPromise) {
      workerBlobUrlPromise = fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')
        .then(r => r.text())
        .then(text => URL.createObjectURL(new Blob([text], { type: 'application/javascript' })));
    }
    return workerBlobUrlPromise;
  }

  // ---- GIF 編碼：把一連串畫好的幀，透過 gif.js 編碼成真正的動態 GIF ----
  function encodeGif(size, totalFrames, frameDelayMs, drawFrameFn) {
    return getWorkerBlobUrl().then(workerUrl => new Promise((resolve, reject) => {
      const off = document.createElement('canvas');
      off.width = size; off.height = size;
      const offCtx = off.getContext('2d');
      const gif = new GIF({
        workers: 2, quality: 16, width: size, height: size,
        workerScript: workerUrl
      });
      const prevCtx = ctx;
      for (let f = 0; f < totalFrames; f++) {
        ctx = offCtx;
        drawFrameFn(f / totalFrames);
        gif.addFrame(offCtx, { copy: true, delay: frameDelayMs });
      }
      ctx = prevCtx;
      gif.on('finished', (blob) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
      gif.render();
    }));
  }

  // 逾時保護：不管背後真正卡在哪裡，超過時間就直接判定失敗，避免畫面永遠停在「運算中」
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('運算逾時（超過 ' + (ms / 1000) + ' 秒）')), ms))
    ]);
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    if (isTutorialMode) {
      finishTutorialAndStart();
      return;
    }

    stepStrokesData[currentStep] = JSON.parse(JSON.stringify(strokes));

    if (currentStep < STEPS_PER_THEME - 1) {
      currentStep++;
      strokes = []; redoStack = [];
      redrawAll();
      updateStepPromptDisplay();
      return;
    }

    if (!confirm('保存後將無法再修改這件作品，確定要保存嗎？')) return;

    const stepParamsArr = stepStrokesData.map(sd => {
      const p = extractDrawingParams(sd, canvasBgColor);
      p.hasUndo = undoCount > 0;
      p.hasClear = clearCount > 0;
      return p;
    });

    const saveBtn = document.getElementById('saveBtn');
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = '運算中…';
    saveBtn.disabled = true;

    let gifDataUrl;
    try {
      gifDataUrl = await withTimeout(encodeGif(GIF_SIZE, 24, 80, (progress) => {
        renderMultiStepFrame(progress, stepParamsArr);
      }), 20000);
    } catch (err) {
      console.error('GIF 運算失敗詳細原因：', err);
      alert('動態畫面運算失敗或逾時，請再試一次。若持續失敗，麻煩把瀏覽器主控台（console）印出的錯誤訊息回報給開發者。');
      saveBtn.textContent = originalLabel;
      saveBtn.disabled = false;
      return;
    }

    saveBtn.textContent = originalLabel;
    saveBtn.disabled = false;

    try {
      const works = loadWorks();
      works.push({
        workId: 'work_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        anonId: anonId,
        createdAt: Date.now(),
        themeIndex: currentThemeIndex,
        themeTitle: currentTheme.title,
        backgroundColor: canvasBgColor,
        thumbnail: gifDataUrl,
        stepStrokesData: stepStrokesData,
        resonance: 0
      });
      saveWorks(works);
      showScreen('screen-saved');
    } catch (err) {
      console.error('保存失敗詳細原因：', err);
      alert('保存失敗，很可能是手機瀏覽器的儲存空間已滿（這段時間測試存了不少作品）。可以到「我的主頁」用清除資料功能釋放空間，或清除這個網站的瀏覽器資料後再試一次。');
    }
  });

  let drawing = false;
  let currentPoints = [];
  let startX = 0, startY = 0;
  let snapshotForPreview = null;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top, t: performance.now() };
  }

  canvas.addEventListener('pointerdown', (e) => {
    drawing = true;
    const p = getPos(e);
    startX = p.x; startY = p.y;
    currentPoints = [p];
    const isFreehand = currentTool === 'pen' || currentTool === 'eraser';
    if (!isFreehand || currentBrush === 'marker') {
      snapshotForPreview = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = getPos(e);
    const isFreehand = currentTool === 'pen' || currentTool === 'eraser';
    const erase = currentTool === 'eraser';

    if (isFreehand) {
      const drawColor = erase ? canvasBgColor : currentColor;
      if (currentBrush === 'marker') {
        currentPoints.push(p);
        ctx.putImageData(snapshotForPreview, 0, 0);
        drawMarkerRibbon(currentPoints, drawColor, currentSize, erase);
      } else {
        const prev = currentPoints[currentPoints.length - 1];
        drawBrushSegment(prev, p, currentBrush, drawColor, currentSize, erase);
        currentPoints.push(p);
      }
    } else {
      ctx.putImageData(snapshotForPreview, 0, 0);
      drawShapeWithBrush(currentTool, startX, startY, p.x, p.y, currentColor, currentSize, currentBrush);
      currentPoints = [currentPoints[0], p];
    }
  });

  window.addEventListener('pointerup', () => {
    if (!drawing) return;
    drawing = false;
    if (currentPoints.length < 2) { currentPoints = []; return; }

    const metrics = computeMetrics(currentPoints);
    const stroke = {
      tool: currentTool, brush: currentBrush, color: currentColor, size: currentSize,
      points: currentPoints.slice(), metrics
    };
    strokes.push(stroke);
    redoStack = [];
    currentPoints = [];
  });

  function speedAtPoint(points, i) {
    if (i === 0) return 0;
    const a = points[i - 1], b = points[i];
    const dt = Math.max(1, b.t - a.t);
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    return Math.min(1, (d / dt) * 1.8);
  }

  function hexToRgba(hex, alpha) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  const MARKER_TIP_ANGLE = -40 * Math.PI / 180;

  function drawMarkerRibbon(points, color, size, erase) {
    if (points.length < 2) return;
    const halfW = size * 0.6;
    const ox = Math.cos(MARKER_TIP_ANGLE) * halfW;
    const oy = Math.sin(MARKER_TIP_ANGLE) * halfW;

    ctx.save();
    ctx.globalAlpha = erase ? 0.95 : 0.5; // 橡皮擦改用畫布底色平塗蓋掉，不再挖透明洞
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0].x + ox, points[0].y + oy);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x + ox, points[i].y + oy);
    for (let i = points.length - 1; i >= 0; i--) ctx.lineTo(points[i].x - ox, points[i].y - oy);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBrushSegment(p1, p2, brush, color, size, erase) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    if (brush === 'smooth') {
      ctx.globalAlpha = 1;
      ctx.lineWidth = size;
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    } else if (brush === 'chalk') {
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const perpAngle = angle + Math.PI / 2;
      const steps = Math.max(1, Math.round(dist / 1.2));
      const dotsPerStep = Math.max(3, Math.round(size / 2.5));
      ctx.globalAlpha = erase ? 0.75 : 0.4;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cx = p1.x + (p2.x - p1.x) * t;
        const cy = p1.y + (p2.y - p1.y) * t;
        for (let k = 0; k < dotsPerStep; k++) {
          const offset = (Math.random() - 0.5) * size;
          const jitter = (Math.random() - 0.5) * 1.2;
          const x = cx + Math.cos(perpAngle) * offset + Math.cos(angle) * jitter;
          const y = cy + Math.sin(perpAngle) * offset + Math.sin(angle) * jitter;
          const r = 0.4 + Math.random() * 0.7;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (brush === 'spray') {
      // 修正：原本只在線段終點噴，直線工具一次性算完整段時只會噴出一個點；
      // 改成沿整段路徑取樣多個點各自噴灑，畫筆連續拖曳、形狀工具一次成型都能正確噴出一整條
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const stepCount = Math.max(1, Math.round(dist / 3));
      const densityPerStep = Math.max(2, Math.round(size * 0.7));
      ctx.globalAlpha = erase ? 0.7 : 0.35;
      for (let s = 0; s <= stepCount; s++) {
        const t = s / stepCount;
        const cx = p1.x + (p2.x - p1.x) * t, cy = p1.y + (p2.y - p1.y) * t;
        for (let i = 0; i < densityPerStep; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rad = Math.random() * size;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (brush === 'watercolor') {
      ctx.save();
      ctx.globalCompositeOperation = erase ? 'source-over' : 'multiply'; // 擦除時不能用multiply（淺色蓋不掉深色），改平塗
      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const steps = Math.max(2, Math.round(dist / 1.2));
      const coreAlpha = erase ? 0.5 : 0.32; // 原本 0.1 太淡，單次畫幾乎看不見，提高到看得清楚
      const midAlpha = erase ? 0.3 : 0.16;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cx = p1.x + (p2.x - p1.x) * t + (Math.random() - 0.5) * size * 0.1;
        const cy = p1.y + (p2.y - p1.y) * t + (Math.random() - 0.5) * size * 0.1;
        const r = size * (1.1 + Math.random() * 0.4);
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        grad.addColorStop(0, hexToRgba(color, coreAlpha));
        grad.addColorStop(0.6, hexToRgba(color, midAlpha));
        grad.addColorStop(1, hexToRgba(color, 0));
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    } else if (brush === 'marker') {
      // 見 drawMarkerRibbon
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function getShapeOutlinePoints(tool, x1, y1, x2, y2) {
    const pts = [];
    const step = 4;
    if (tool === 'line') {
      pts.push({ x: x1, y: y1 }, { x: x2, y: y2 });
    } else if (tool === 'rect') {
      const rx = Math.min(x1, x2), ry = Math.min(y1, y2);
      const rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1);
      const corners = [
        { x: rx, y: ry }, { x: rx + rw, y: ry }, { x: rx + rw, y: ry + rh }, { x: rx, y: ry + rh }, { x: rx, y: ry }
      ];
      for (let c = 0; c < 4; c++) {
        const a = corners[c], b = corners[c + 1];
        const edgeLen = Math.hypot(b.x - a.x, b.y - a.y);
        const n = Math.max(1, Math.round(edgeLen / step));
        for (let i = 0; i < n; i++) {
          const t = i / n;
          pts.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
        }
      }
      pts.push(corners[0]);
    } else if (tool === 'circle') {
      const r = Math.hypot(x2 - x1, y2 - y1);
      const circ = 2 * Math.PI * r;
      const n = Math.max(8, Math.round(circ / step));
      for (let i = 0; i <= n; i++) {
        const a = (i / n) * Math.PI * 2;
        pts.push({ x: x1 + Math.cos(a) * r, y: y1 + Math.sin(a) * r });
      }
    }
    for (let i = 0; i < pts.length; i++) pts[i].t = i * 16;
    return pts;
  }

  function drawShapeWithBrush(tool, x1, y1, x2, y2, color, size, brush) {
    const pts = getShapeOutlinePoints(tool, x1, y1, x2, y2);
    if (pts.length < 2) return;
    if (brush === 'marker') {
      drawMarkerRibbon(pts, color, size);
    } else {
      for (let i = 1; i < pts.length; i++) drawBrushSegment(pts[i - 1], pts[i], brush, color, size);
    }
  }

  function redrawAll() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = canvasBgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const s of strokes) {
      const isFreehand = s.tool === 'pen' || s.tool === 'eraser';
      const erase = s.tool === 'eraser';
      const drawColor = erase ? canvasBgColor : s.color;
      if (isFreehand && s.brush === 'marker') {
        drawMarkerRibbon(s.points, drawColor, s.size, erase);
      } else if (isFreehand) {
        for (let i = 1; i < s.points.length; i++) {
          drawBrushSegment(s.points[i - 1], s.points[i], s.brush, drawColor, s.size, erase);
        }
      } else {
        const p1 = s.points[0], p2 = s.points[s.points.length - 1];
        drawShapeWithBrush(s.tool, p1.x, p1.y, p2.x, p2.y, s.color, s.size, s.brush);
      }
    }
  }

  function computeMetrics(points) {
    let pathLength = 0;
    let speedSum = 0, speedCount = 0;
    let curvSum = 0, curvCount = 0;
    let lastAngle = null;

    for (let i = 1; i < points.length; i++) {
      const a = points[i - 1], b = points[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      pathLength += d;
      const dt = Math.max(1, b.t - a.t);
      const speed = Math.min(1, (d / dt) * 1.8);
      speedSum += speed; speedCount++;

      if (d > 1) {
        const angle = Math.atan2(dy, dx);
        if (lastAngle !== null) {
          let diff = Math.abs(angle - lastAngle);
          if (diff > Math.PI) diff = Math.PI * 2 - diff;
          curvSum += Math.min(1, diff / (Math.PI * 0.6));
          curvCount++;
        }
        lastAngle = angle;
      }
    }

    return {
      pathLength,
      duration: points[points.length - 1].t - points[0].t,
      avgSpeed: speedCount > 0 ? speedSum / speedCount : 0,
      avgCurvature: curvCount > 0 ? curvSum / curvCount : 0
    };
  }

  function renderBrushThumbs() {
    document.querySelectorAll('.brush-thumb').forEach(thumbCanvas => {
      const brush = thumbCanvas.dataset.thumb;
      const tctx = thumbCanvas.getContext('2d');
      const w = thumbCanvas.width, h = thumbCanvas.height;
      tctx.clearRect(0, 0, w, h);
      tctx.fillStyle = '#FFFFFF';
      tctx.fillRect(0, 0, w, h);

      const pts = [];
      const n = 14;
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        pts.push({
          x: 8 + t * (w - 16),
          y: h / 2 + Math.sin(t * Math.PI * 1.6) * (h * 0.24),
          t: i * 16
        });
      }

      const prevCtx = ctx;
      ctx = tctx;
      const demoColor = '#3A3A38';
      const demoSize = Math.max(3, Math.min(6, h * 0.22));
      if (brush === 'marker') {
        drawMarkerRibbon(pts, demoColor, demoSize);
      } else {
        for (let i = 1; i < pts.length; i++) drawBrushSegment(pts[i - 1], pts[i], brush, demoColor, demoSize);
      }
      ctx = prevCtx;
    });
  }

  renderBrushThumbs();

  if (isReturningUser) {
    showScreen('screen-gallery');
  }
})();
</script>
</body>
</html>
